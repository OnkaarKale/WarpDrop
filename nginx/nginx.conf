worker_processes 1;
pid /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/nginx.pid;
error_log /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/logs/access.log;

    client_body_temp_path /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/temp/client_body;
    proxy_temp_path /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/temp/proxy;
    fastcgi_temp_path /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/temp/fastcgi;
    uwsgi_temp_path /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/temp/uwsgi;
    scgi_temp_path /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/temp/scgi;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # HTTP Server (Port 8080)
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # HTTPS Server (Port 8443) - Secure context for Camera QR Scanner on Mobile
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/certs/server.crt;
        ssl_certificate_key /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

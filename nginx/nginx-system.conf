# Nginx Configuration for Secure P2P File Transfer
# Place this in /etc/nginx/sites-available/file-transfer
# and symlink to /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP Server (Port 80)
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. HTTPS Server (Port 443) - Enables Camera QR Scanner on Mobile
server {
    listen 443 ssl;
    server_name _;

    # Update these paths to match your certificate locations if needed:
    ssl_certificate /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/certs/server.crt;
    ssl_certificate_key /home/onkaar-kale/Onkar/Projects/Antigravity/FileTransferApp/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
